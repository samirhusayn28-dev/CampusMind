name: Build & Release CampusMind Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install

      - name: 🔐 Configure Environment
        run: |
          cat << 'ENVFILE' > mobile/.env
          EXPO_PUBLIC_BACKEND_URL=https://campusmind-backend.vercel.app
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=campusmind-d65c1
          EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyCblXoyveX8NqcGH19Hg5YMoAuaSWOuC7U
          EXPO_PUBLIC_FIREBASE_APP_ID=1:220472508393:android:d9de82b3808138e8d2d578
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=campusmind-d65c1.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=campusmind-d65c1.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=220472508393
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=220472508393-0kviptkk3bo3a8sv9qi19qluiuj4pq7q.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=220472508393-m63rfu8n1ul1l613u1i7oblae4n3moav.apps.googleusercontent.com
          ENVFILE

      - name: ⚙️ Prebuild Native Android Project
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_BACKEND_URL: https://campusmind-backend.vercel.app
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: campusmind-d65c1
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyCblXoyveX8NqcGH19Hg5YMoAuaSWOuC7U
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:220472508393:android:d9de82b3808138e8d2d578
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: campusmind-d65c1.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: campusmind-d65c1.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '220472508393'
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 220472508393-0kviptkk3bo3a8sv9qi19qluiuj4pq7q.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 220472508393-m63rfu8n1ul1l613u1i7oblae4n3moav.apps.googleusercontent.com
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: 🔑 Configure Release Keystore & Verify SHA-1
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p mobile/android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from GitHub Secrets (ANDROID_KEYSTORE_BASE64)"
            echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/campusmind-release.keystore
          elif [ -f "mobile/keystore/campusmind-release.keystore" ]; then
            echo "Using committed release keystore from mobile/keystore/campusmind-release.keystore"
            cp mobile/keystore/campusmind-release.keystore mobile/android/app/campusmind-release.keystore
          else
            echo "❌ Error: Neither secret ANDROID_KEYSTORE_BASE64 nor mobile/keystore/campusmind-release.keystore found!"
            exit 1
          fi

          echo "=========================================================="
          echo "🔑 VERIFYING RELEASE KEYSTORE & PRINTING SHA-1 FINGERPRINT"
          echo "=========================================================="
          keytool -list -v -keystore mobile/android/app/campusmind-release.keystore -alias campusmind -storepass campusmind123

          # Inject release signingConfig into mobile/android/app/build.gradle
          node scripts/configure-release-keystore.js

      - name: 🐘 Build Release APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          EXPO_PUBLIC_BACKEND_URL: https://campusmind-backend.vercel.app
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: campusmind-d65c1
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyCblXoyveX8NqcGH19Hg5YMoAuaSWOuC7U
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:220472508393:android:d9de82b3808138e8d2d578
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: campusmind-d65c1.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: campusmind-d65c1.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '220472508393'
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 220472508393-0kviptkk3bo3a8sv9qi19qluiuj4pq7q.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 220472508393-m63rfu8n1ul1l613u1i7oblae4n3moav.apps.googleusercontent.com
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📋 Prepare APK Artifact
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-artifacts/CampusMind.apk

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: CampusMind-Android-APK
          path: release-artifacts/CampusMind.apk

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: "CampusMind ${{ github.event.inputs.version || github.ref_name }} - Standalone Android APK"
          body: |
            ## 🎓 CampusMind — Your AI-Powered Daily Study Companion

            Download and install the standalone **CampusMind Android APK** directly onto your phone without needing Expo Go or any local developer setup.

            ### ✨ Features in this Release:
            - **Material You Aesthetic:** Soft pastel palette, cozy warm charcoal dark mode, rounded Plus Jakarta Sans typography, and fluid micro-interactions.
            - **Multi-Format Ingestion:** Instant extraction from PDFs, YouTube lectures, live microphone speech (Groq Whisper), and handwritten notes photos (Google Cloud Vision OCR).
            - **AI Summarization & Key Points:** High-yield exam breakdowns generated by Groq LLaMA 3.3 70B.
            - **Bilingual Study Mode:** Seamlessly switch between English, natural Roman Urdu, and formal Urdu script (RTL).
            - **Text-to-Speech (Audio Revision):** Hands-free on-device audio playback with speed controls (`0.8x`–`1.5x`).
            - **Interactive Practice Quizzes:** Active recall multiple-choice quizzes with instant explanations and score tracking.
            - **RAG Lecture Chat:** Ask questions directly to your uploaded notes powered by Pinecone integrated vector retrieval (`llama-text-embed-v2`) with grounded excerpt citations.
            - **Interactive Concept Maps:** 2D interactive SVG node-link diagrams visualizing knowledge relationships.
            - **SM-2 Spaced Repetition:** Scientifically scheduled revision intervals and status badges (*Due Today*, *Overdue*, *Mastered*).
            - **Daily Dashboard & Streaks:** Time-of-day companion greetings, streak tracking, and quick-access review cards.

            ### 📲 How to Install:
            1. Download `CampusMind.apk` below on your Android device.
            2. Tap the downloaded `.apk` in your browser or file manager.
            3. If prompted, toggle on *"Allow from this source"* (Install unknown apps).
            4. Tap **Install** and open CampusMind!
          files: release-artifacts/CampusMind.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
